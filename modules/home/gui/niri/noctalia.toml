# Noctalia, used for its BAR only.
#
# It replaces waybar on the top edge. Every other role noctalia has is switched
# off in favour of the single-purpose shell this repo already sets up and has
# live-tested: swaync for notifications, swayosd for the OSD, swaybg for the
# wallpaper, cliphist for the clipboard, hyprlock for the locker. Those stay,
# because each one is proven here and noctalia's replacement for it is not.
#
# That is why the widget list below is narrower than noctalia's default: a
# widget whose panel is switched off opens an empty window, which looks broken
# rather than absent. So `notifications` (swaync owns the daemon), `clipboard`
# (cliphist owns the history), and `wallpaper` (swaybg owns the background) are
# all left out of `start` / `end` even though noctalia defaults to them.
#
# NOTE: this file is a base layer only. The shell writes its own state to
# ~/.local/state/noctalia/settings.toml, and `noctalia config export --help`
# states the order: "every *.toml in the active config dir, then the state-dir
# settings.toml overrides". A value changed in noctalia's own Settings UI is
# saved to the state file and therefore WINS over anything set here. If a key
# below looks ignored, check the state file before editing this one.

[shell]
# The first-run "Welcome to Noctalia" window. Already dismissed on this host;
# without this it can reappear after the state dir is wiped.
setup_wizard_enabled = false

# Noctalia's own polkit agent. services.polkit-gnome stays enabled in niri.nix,
# so this must remain false: two agents answer the same request and the loser's
# dialog is left orphaned on screen.
polkit_agent = false

# Off — cliphist already watches wl-paste and the clipboard widget is dropped
# from the bar below, so a second watcher would only duplicate the work.
clipboard_enabled = false

[bar.default]
enabled = true

# Top edge, floating island. `margin_ends = 100` and `reserve_space = true` are
# what make it a centered capsule rather than a full-width strip; both are the
# packaged defaults, restated here so the shape is visible in this file.
position = "top"
thickness = 30
radius = 12
margin_ends = 100
reserve_space = true

# Left: launcher (opens noctalia's app launcher), wallpapers, workspace pills.
# The default puts `launcher` first, which is the only entry point worth having
# now that waybar's click targets are gone.
start = [ "launcher", "workspaces" ]

# Right, in order. Everything here was opened and checked on this machine:
#   volume          -> control-center / audio panel with real sink + app sliders
#   control-center  -> the same panel, plus the shortcuts grid
#   session         -> power menu (lock, logout, reboot, shutdown)
#   tray            -> StatusNotifier host; blueman and nm-applet attach to it
# network / bluetooth / battery / brightness / media are plain indicators.
end = [
  "media",
  "tray",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]

# swaync holds org.freedesktop.Notifications. Two daemons cannot both own that
# name, and swaync is the one with a configured theme and a proven history, so
# noctalia's daemon stays off.
[notification]
enable_daemon = false

# swayosd-client drives the media keys from config.kdl and draws its own OSD.
# Enabling this would give every keypress two popups.
[osd]
enabled = false

# swaybg draws ~/.config/niri/wallpaper.png. Noctalia would draw a second
# surface over it.
[wallpaper]
enabled = false

# hyprlock locks the session; /etc/pam.d/hyprlock is declared in
# profiles/desktops/niri.nix. This must stay off -- a locker that cannot
# authenticate is a soft lockout, and noctalia's PAM service is not declared.
[lockscreen]
enabled = false

# The power menu. noctalia's own action set is lock, suspend, lock-and-suspend,
# logout, reboot, reboot-uefi and shutdown -- there is no hibernate in it. The
# escape hatch is action = "command", running an arbitrary command. `custom` is
# the name the settings UI and the i18n catalogs use, but the panel does not
# know it: it logs `skipping unknown action "custom"` and draws nothing.
# `noctalia config validate` accepts both, so only the panel's own log tells
# them apart. Writing the list at all replaces the default one.
#
# `lock` and `lock_and_suspend` are left out on purpose: both drive noctalia's
# own lockscreen, which is disabled above, so they would draw a button that
# cannot lock anything. hyprlock is on Mod+L, and lock-before-suspend is
# already handled by `swayidle -w before-sleep hyprlock` in config.kdl.
[shell.session]
grid = false
show_shortcuts = true

[[shell.session.actions]]
action = "logout"
variant = "default"

[[shell.session.actions]]
action = "suspend"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
label = "Hibernate"
variant = "default"

[[shell.session.actions]]
action = "reboot"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
