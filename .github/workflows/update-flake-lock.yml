# ponytail: daily nix flake update, committed directly once every host builds.
#
# The gate is job order, not a GitHub required check: `required_status_checks` on
# the branch would force every hand-made push through a PR too. A failing build
# commits nothing — you get one red workflow run, which is the only thing worth
# looking at. There is no PR to read, by design.
#
# The commit is made with the `createCommitOnBranch` GraphQL mutation rather than
# `git push`, because main requires verified signatures and a commit carrying the
# Actions token is otherwise unsigned. GitHub signs commits made through that
# mutation itself (proven: verification.reason == "valid"). The alternative — a
# ruleset bypass for the Actions integration — is not allowed on personal repos
# ("Actor GitHub Actions integration must be part of the ruleset source or owner
# organization"), and a PR + squash-merge cannot work either: the PR head is
# unsigned, so the required check blocks the merge for a non-admin token.
#
# Actions are pinned to commit SHAs: a mutable tag on a third-party action is
# arbitrary code running with your token on every push.
name: update-flake-lock

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix flake update

      # Discovered from the flake, never listed here: a new host in hosts/<name>/
      # joins the build on its own.
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

      # Hand the updated lock to the build job; it is not committed yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  build:
    needs: update
    runs-on: ubuntu-latest
    # One runner, all hosts, in sequence. Each matrix job got a fresh runner with
    # a COLD nix store, so run 43418143255 re-downloaded the same shared NixOS
    # closure per host: kirito 5.4 GiB / 2262 paths and 227 derivations built
    # from scratch, surface 5.3 GiB / 2255 paths and 222 derivations, while mail
    # hit the cache for 0.0 KiB. The local store IS the cache: on one runner the
    # 2nd and 3rd host reuse what the 1st fetched (run 43422438336 pulled 5.5 GiB
    # once, then 176 MiB, and went 15m29s -> 6m29s).
    #
    # No magic-nix-cache: it pushed one GitHub cache entry per store path, and a
    # NixOS closure is thousands of tiny paths, so it tripped the cache API's
    # rate limit and disabled itself. Measured over a full green run: 0 paths
    # uploaded, 278 throttles, 'disabling binary cache' 5 times. It only ever
    # served what this same job had just downloaded. Removed rather than tuned.
    # Cross-run reuse needs a real binary cache (attic/cachix on a box you own);
    # add one when a cold run's ~5 GiB matters more than another service.
    # Hosts still come from the flake, never a list here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-lock

      - name: Build every host
        env:
          HOSTS: ${{ needs.update.outputs.hosts }}
        run: |
          failed=''
          for host in $(printf '%s' "$HOSTS" | tr -d '[]" ' | tr ',' ' '); do
            echo "::group::build $host"
            if nix build --no-link --print-out-paths \
                 ".#nixosConfigurations.$host.config.system.build.toplevel"; then
              echo "$host OK"
            else
              failed="$failed $host"
            fi
            echo '::endgroup::'
          done
          [ -z "$failed" ] || { echo "::error::failed hosts:$failed"; exit 1; }

  publish:
    needs: [update, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-lock

      # Most days nix flake update changes nothing; exit quietly.
      - id: diff
        run: git diff --quiet flake.lock || echo "changed=1" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The GraphQL input object is inlined, not passed as a variable: gh cannot
          # coerce a JSON string into an input object (-f stringifies, -F parses
          # only primitives), and both fail with
          #   Variable $input of type CreateCommitOnBranchInput! was provided invalid value
          contents=$(base64 -w0 flake.lock)

          # expectedHeadOid makes this a compare-and-swap: if anything was pushed
          # to main while the builds ran, the mutation fails instead of silently
          # overwriting it. Retried once against the new head.
          for attempt in 1 2; do
            head=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
            query=$(printf 'mutation { createCommitOnBranch(input: { branch: { repositoryNameWithOwner: "%s", branchName: "main" }, message: { headline: "chore(deps): update flake.lock" }, fileChanges: { additions: [ { path: "flake.lock", contents: "%s" } ] }, expectedHeadOid: "%s" }) { commit { oid } } }' "${{ github.repository }}" "$contents" "$head")

            if gh api graphql -f query="$query" >/dev/null; then
              echo "committed flake.lock on main"
              exit 0
            fi
            echo "attempt $attempt failed, retrying against the new head" >&2
            sleep 5
          done
          echo "::error::could not commit the updated flake.lock" >&2
          exit 1
