# ponytail: twice-daily nix flake update, committed once the *server* hosts build.
#
# The gate is job order, not a GitHub required check: `required_status_checks` on
# the branch would force every hand-made push through a PR too. A failing build
# commits nothing — you get one red workflow run, which is the only thing worth
# looking at. There is no PR to read, by design.
#
# Which hosts gate the commit is a role decision, not a host list: servers do,
# desktops do not. A desktop package that stops compiling on a new nixpkgs must
# not hold back an nginx security fix for a day (or forever, until someone fixes
# it) — that coupling is what this split removes. The desktop hosts still build
# and go red when they break; they just do not block.
#
# The commit is made with the `createCommitOnBranch` GraphQL mutation rather than
# `git push`, because main requires verified signatures and a commit carrying the
# Actions token is otherwise unsigned. GitHub signs commits made through that
# mutation itself (proven: verification.reason == "valid"). The alternative — a
# ruleset bypass for the Actions integration — is not allowed on personal repos
# ("Actor GitHub Actions integration must be part of the ruleset source or owner
# organization"), and a PR + squash-merge cannot work either: the PR head is
# unsigned, so the required check blocks the merge for a non-admin token.
#
# Actions are pinned to commit SHAs: a mutable tag on a third-party action is
# arbitrary code running with your token on every push.
name: update-flake-lock

# GitHub's scheduler is best effort and the queue spike is at the TOP of every
# hour, so `0 6 * * *` sat in it: measured over 114 scheduled runs, avg delay was
# 400-560 min from November onward (the 13:59 run was scheduled for 06:00), and
# the 14th's run had not started 143 min past its slot. Their troubleshooting
# docs say it outright: "To decrease the chance of delay, schedule your workflow
# to run at a different time of the hour." Hence :17. Twice a day, not once: the
# hosts poll hourly, so the only thing a once-daily run buys is up to 24h of dead
# time between an upstream fix and the lock that carries it. Nothing here cares
# about the exact hour, so wander off-peak and drop it.
on:
  schedule:
    - cron: "17 6,18 * * *" # twice daily, ~06:17 and ~18:17 UTC; off the hour on purpose
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  actions: write # cache-nix-action purges old entries via the Actions API

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
      desktops: ${{ steps.list.outputs.desktops }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix flake update

      # Discovered from the flake, never listed here: a new host in hosts/<name>/
      # joins the build on its own. The role split is discovered the same way —
      # a host is a server when its file imports profiles/server.nix, which is
      # also the file that puts it on the small channel. "Runs the small channel"
      # and "must not be blocked by a desktop breakage" stay one predicate, so
      # there is no second list to keep in sync.
      - id: list
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | tr -d '[]" ' | tr ',' ' ')
          servers=''; desktops=''
          for host in $hosts; do
            if grep -q 'profiles/server\.nix' "hosts/$host/default.nix" 2>/dev/null; then
              servers="$servers $host"
            else
              desktops="$desktops $host"
            fi
          done
          echo "servers=${servers# }" >> "$GITHUB_OUTPUT"
          echo "desktops=${desktops# }" >> "$GITHUB_OUTPUT"
          echo "servers:${servers# } desktops:${desktops# }"

      # Hand the updated lock to the build job; it is not committed yet.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  # One runner per role, not a matrix: a matrix needs every job to succeed before
  # `publish` runs, which is exactly the coupling this split exists to remove.
  # Two jobs also keep the cache locality described below — one store per role, so
  # the second server reuses what the first fetched — at the cost of the two roles
  # no longer sharing a store. That trade is the point: the small server closure
  # stops waiting behind kirito's 12 GiB one. Each role gets its own cache key, or
  # the two would overwrite each other's primary entry.
  build-servers:
    needs: update
    if: needs.update.outputs.servers != ''
    runs-on: ubuntu-latest
    # One runner, all hosts of this role, in sequence. Each matrix job got a fresh
    # runner with a COLD nix store, so run 43418143255 re-downloaded the same
    # shared NixOS closure per host: kirito 5.4 GiB / 2262 paths and 227
    # derivations built from scratch, while mail hit the cache for 0.0 KiB. The
    # local store IS the cache: on one runner the 2nd host reuses what the 1st
    # fetched (run 43422438336 pulled 5.5 GiB once, then 176 MiB, and went
    # 15m29s -> 6m29s).
    #
    # Cross-run caching via cache-nix-action, NOT magic-nix-cache. GitHub's cache
    # allows 200 uploads/min/repo; magic-nix-cache pushed one entry per store path
    # and mail's closure alone is 923 paths, so it rate-limited itself out and
    # uploaded nothing (measured: 0 uploads, 278 throttles, self-disabled 5x).
    # cache-nix-action saves /nix as one entry, which is what makes it viable.
    #
    # It earns its keep on the paths cache.nixos.org does not have, which is also
    # where the time goes: pi-1.5.2 (53s, 188 MiB) and formatelf-0.2.2 (50s,
    # 48 MiB) are both 404 upstream. Stock nixpkgs paths are cheaper to re-fetch
    # from cache.nixos.org than to restore from the 10 GB repo cache, which is
    # why gc-max-store-size is capped.
    # Hosts still come from the flake, never a list here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # keep-outputs: a .drv in the store then protects its output from gc.
          # Rooting the toplevels is not enough on its own -- that only keeps
          # their RUNTIME closure, and formatelf-0.2.2 is a build-time input of
          # pi, absent from all three outputs' closures. Measured: with --out-link
          # alone, gc still deleted formatelf-0.2.2 while pi-1.5.2 survived.
          extra-conf: keep-outputs = true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-lock

      # Restore before building so the slow non-upstream paths are already here.
      #
      # The key is the lock hash, so there is one entry per role and it is only
      # rewritten when the lock moves. That is deliberate, but it means the very
      # first save is the only save: the action logs `Not collecting garbage. /
      # Not saving a new cache.` on every later run (its own docs: "this input
      # has no effect if primary-key hit occurs when starting to save"). So the
      # GC below must not eat what we want cached, or it is eaten permanently.
      #
      # It did. `nix build --no-link` creates no GC roots, so the 3G cap made
      # `nix store gc` delete the build results in the same step that was about
      # to tar them up: the frozen entry held pi-1.5.2 only as a .drv, and every
      # later run "hit the cache" and rebuilt it anyway. The build step now
      # passes --out-link, which roots the toplevels for the rest of the job, and
      # the cap is above the closure of the role it caches.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-servers-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-servers-
          # stock nixpkgs paths are a fast re-download from cache.nixos.org; only
          # the non-upstream ones (pi-1.5.2 188 MiB, formatelf-0.2.2 48 MiB) are
          # worth the repo's 10 GB cache budget
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-servers-
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build every server host
        env:
          HOSTS: ${{ needs.update.outputs.servers }}
        run: |
          failed=''
          for host in $HOSTS; do
            echo "::group::build $host"
            # --out-link, not --no-link: the result symlink is a GC root, which is
            # what stops the cache action's post-job gc from deleting the output
            # before it is tarred. See the cache-nix-action comment above.
            if nix build --out-link "/tmp/result-$host" --print-out-paths \
                 ".#nixosConfigurations.$host.config.system.build.toplevel"; then
              echo "$host OK"
            else
              failed="$failed $host"
            fi
            echo '::endgroup::'
          done
          [ -z "$failed" ] || { echo "::error::failed hosts:$failed"; exit 1; }

  # Same shape, own cache, and deliberately NOT a dependency of `publish`.
  build-desktops:
    needs: update
    if: needs.update.outputs.desktops != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: keep-outputs = true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-lock

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-desktops-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-desktops-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-desktops-
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build every desktop host
        env:
          HOSTS: ${{ needs.update.outputs.desktops }}
        run: |
          failed=''
          for host in $HOSTS; do
            echo "::group::build $host"
            if nix build --out-link "/tmp/result-$host" --print-out-paths \
                 ".#nixosConfigurations.$host.config.system.build.toplevel"; then
              echo "$host OK"
            else
              failed="$failed $host"
            fi
            echo '::endgroup::'
          done
          [ -z "$failed" ] || { echo "::error::failed hosts:$failed"; exit 1; }

  publish:
    needs: [update, build-servers]
    # `skipped` when there are no server hosts at all — a vacuous pass, not a
    # failure. A skipped desktop job never reaches here, because it is not in
    # `needs`: desktop breakage goes red without holding the lock back.
    if: needs.build-servers.result == 'success' || needs.build-servers.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-lock

      # Most days nix flake update changes nothing; exit quietly.
      - id: diff
        run: git diff --quiet flake.lock || echo "changed=1" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The GraphQL input object is inlined, not passed as a variable: gh cannot
          # coerce a JSON string into an input object (-f stringifies, -F parses
          # only primitives), and both fail with
          #   Variable $input of type CreateCommitOnBranchInput! was provided invalid value
          contents=$(base64 -w0 flake.lock)

          # expectedHeadOid makes this a compare-and-swap: if anything was pushed
          # to main while the builds ran, the mutation fails instead of silently
          # overwriting it. Retried once against the new head.
          for attempt in 1 2; do
            head=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
            query=$(printf 'mutation { createCommitOnBranch(input: { branch: { repositoryNameWithOwner: "%s", branchName: "main" }, message: { headline: "chore(deps): update flake.lock" }, fileChanges: { additions: [ { path: "flake.lock", contents: "%s" } ] }, expectedHeadOid: "%s" }) { commit { oid } } }' "${{ github.repository }}" "$contents" "$head")

            if gh api graphql -f query="$query" >/dev/null; then
              echo "committed flake.lock on main"
              exit 0
            fi
            echo "attempt $attempt failed, retrying against the new head" >&2
            sleep 5
          done
          echo "::error::could not commit the updated flake.lock" >&2
          exit 1
